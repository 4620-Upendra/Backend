<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(to right, #141e30, #243b55);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 360px;
            background: #1f2a40;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            color: white;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 40px 10px 10px;
            border-radius: 5px;
            border: none;
            outline: none;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 33px;
            cursor: pointer;
            font-size: 13px;
            color: #00c6ff;
            user-select: none;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background: #00c6ff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: black;
        }

        .login-btn:hover {
            background: #00a3cc;
        }

        .links {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .links a {
            color: #00c6ff;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>

   
</head>

<body>

<div class="login-box">
    <h2>Login</h2>

    <form action="LoginCheck" method="post">

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" autocomplete="off" name="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" id="password"
                   placeholder="Enter your password" required>
            <span class="toggle-password" id="toggleText"
                  onclick="togglePassword()">Show</span>
        </div>

        <button type="submit" class="login-btn">Login</button>

    </form>

    <div class="links">
        <p>New user? <a href="register.html">Register here</a></p>
    </div>

    <div class="footer">
        © 2025 Student Management System
    </div>
</div>

 <!-- Show / Hide Password -->
    <script>
        function togglePassword() {
            const pwd = document.getElementById("password");
            const text = document.getElementById("toggleText");

            if (pwd.type === "password") {
                pwd.type = "text";
                text.innerText = "Hide";
            } else {
                pwd.type = "password";
                text.innerText = "Show";
            }
        }
        
        
        fetch("RegisterMessageServlet",{
        	method:"post"
        })
        .then(res=>res.text())
        .then(msg=>{
        	if(msg.trim()!==""){
        		alert(msg);
        	}
        });
        
        fetch("LoginCheckMessage", {
            method: "POST"
        })
        .then(res => res.text())
        .then(msg => {
            if (msg.trim() !== "") {
                alert(msg);   
            }
        });
    </script>

</body>
</html>
